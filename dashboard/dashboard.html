<!DOCTYPE html>
<html>
<head>
  <title>Real-Time Website Analytics</title>
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: #eee;
      padding: 20px;
    }

    h2 { color: #00d9a0; }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #333;
      padding: 8px;
      text-align: left;
    }

    th { background: #222; }

    .card {
      display: inline-block;
      margin: 10px;
      padding: 15px;
      background: #1a1d27;
      border-radius: 8px;
      min-width: 150px;
    }

    .value {
      font-size: 22px;
      font-weight: bold;
      color: #6c63ff;
    }
  </style>
</head>

<body>

<h2>📊 Live Website Analytics</h2>

<!-- KPI -->
<div>
  <div class="card">
    Total Visits<br>
    <span class="value" id="total">0</span>
  </div>

  <div class="card">
    Pages<br>
    <span class="value" id="pagesCount">0</span>
  </div>

  <div class="card">
    Actions<br>
    <span class="value" id="actionsCount">0</span>
  </div>

  <div class="card">
    Users<br>
    <span class="value" id="usersCount">0</span>
  </div>
</div>

<!-- TABLE -->
<h3>Page Visits</h3>

<table>
  <thead>
    <tr>
      <th>Page</th>
      <th>Visits</th>
    </tr>
  </thead>
  <tbody id="table"></tbody>
</table>

<script>

async function loadStats() {
  try {
    const res = await fetch("/stats");   // IMPORTANT: relative path
    const data = await res.json();

    // KPI
    document.getElementById("total").innerText =
      data.total_visits || 0;

    document.getElementById("pagesCount").innerText =
      Object.keys(data.pages || {}).length;

    document.getElementById("actionsCount").innerText =
      Object.keys(data.actions || {}).length;

    document.getElementById("usersCount").innerText =
      Object.keys(data.users || {}).length;

    // Table
    let table = document.getElementById("table");
    table.innerHTML = "";

    for (let page in data.pages) {
      table.innerHTML += `
        <tr>
          <td>${page}</td>
          <td>${data.pages[page]}</td>
        </tr>
      `;
    }

  } catch (err) {
    console.log("Error:", err);
  }
}

loadStats();
setInterval(loadStats, 3000);

</script>

</body>
</html>
